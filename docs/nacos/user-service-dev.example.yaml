# 复制到 Nacos 控制台
# Data ID = user-service-dev.yaml
# Group   = DEFAULT_GROUP
# 命名空间与 user-service/bootstrap.yml 里 spring.cloud.nacos.config.namespace 一致
#
# 手机号防重复注册（RegisterPhoneRedisService）只依赖下方 spring.data.redis，
# 无需单独配置 register:phone 前缀；读/写由代码固定为 register:phone:{手机号}

server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://82.157.176.149:3306/contentgenius_user?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 你的MySQL密码
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 82.157.176.149
      port: 6379
      # 若 Redis 设置了 requirepass，取消下一行注释并填写密码
      # password: 你的Redis密码

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret-key: 你的JWT密钥
  expire-time: 604800000
  skip-auth-urls:
    - /api/users/register
    - /api/users/login
    - /api/users/sms/send

# 号码认证 SendSmsVerifyCode（控制台「快速测试」里的系统签名+模板）
contentgenius:
  sms:
    access-key-id: 你的AccessKeyId
    access-key-secret: 你的AccessKeySecret
    sign-name: 速通互联验证码
    template-code: "100001"
    code-ttl-seconds: 300
    send-interval-seconds: 60
