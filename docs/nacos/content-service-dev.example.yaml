# 复制到 Nacos：Data ID = content-service-dev.yaml，Group = DEFAULT_GROUP
# 命名空间与 bootstrap.yml 一致（dev）

server:
  port: 8082

spring:
  datasource:
    url: jdbc:mysql://82.157.176.149:3306/contentgenius_content?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 82.157.176.149
      port: 6379
      password: 你的redis密码

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

# MinIO（endpoint/accessKey/secretKey/bucket 等按你环境填写）
minio:
  endpoint: http://82.157.176.149:9000
  access-key: 你的accessKey
  secret-key: 你的secretKey
  bucket-name: contentgenius
  max-files-per-user: 3

# 与 gateway-service-dev、user-service-dev 保持一致
jwt:
  secret-key: 你的密钥
  expire-time: 86400000
  skip-auth-urls:
    - /actuator
